name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16, env: {POSTGRES_DB: azatech, POSTGRES_USER: azatech, POSTGRES_PASSWORD: secret}, ports: ['5432:5432'], options: >- --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5}
      redis: {image: redis:7, ports: ['6379:6379']}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: pdo_pgsql, coverage: none}
      - uses: actions/cache@v4
        with: {path: backend/vendor, key: composer-${{ hashFiles('backend/composer.json') }} }
      - run: cd backend && composer install --no-interaction
      - run: cd backend && cp .env.example .env && php artisan key:generate
      - run: cd backend && php artisan migrate --force
        env: {DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_DATABASE: azatech, DB_USERNAME: azatech, DB_PASSWORD: secret}
      - run: cd backend && vendor/bin/pint --test
      - run: cd backend && vendor/bin/phpstan analyse
      - run: cd backend && php artisan test
        env: {DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_DATABASE: azatech, DB_USERNAME: azatech, DB_PASSWORD: secret, REDIS_HOST: 127.0.0.1}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm install
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build
